site_name: Agent on Demand
site_description: A REST API for spawning AI coding agents inside Sprite microVMs.
site_url: https://jakegaylor.com/aod-ex/
repo_url: https://github.com/jhgaylor/aod-ex
repo_name: jhgaylor/aod-ex
edit_uri: edit/main/site/docs/

# `site/docs/` is partly hand-written and partly mirrored from
# elsewhere in the repo (priv/help/, clients/*/README.md,
# docs/{deploy,runbook}.md, .claude/skills/aod/SKILL.md) by the
# `sync_content.sh` script before mkdocs runs.
docs_dir: docs
site_dir: ../_site

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - content.code.annotate
    # Linked content tabs: tab groups with the same labels sync
    # across the page (and across pages, via localStorage). Pick
    # Python in one example, every other example flips to Python.
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Why: why.md
  - How it works: how-it-works.md
  - Examples: examples.md
  - Docs:
      - Install: install.md
      - Quickstart: quickstart.md
      - Concepts:
          - Agents: concepts/agents.md
          - Environments: concepts/environments.md
          - Manifest (aod apply): concepts/manifest.md
          - Spawning sub-agents: concepts/spawning.md
          - Skills: concepts/skills.md
          - API reference: concepts/api.md
          - Secrets managers:
              - Overview: concepts/secrets-managers.md
              - 1Password: concepts/secrets/1password.md
              - Bitwarden (bws): concepts/secrets/bws.md
              - Infisical: concepts/secrets/infisical.md
      - SDKs:
          - Python: sdks/python.md
          - TypeScript: sdks/typescript.md
          - Go: sdks/go.md
          - Elixir: sdks/elixir.md
      - Operating:
          - Deploy: operating/deploy.md
          - Runbook: operating/runbook.md
