<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spec-Driven Development — AoD + acai.sh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    * { font-family: 'Inter', sans-serif; }
    code, pre, .mono { font-family: 'JetBrains Mono', monospace; }
    .log-line { opacity: 0; transform: translateY(4px); transition: opacity 0.15s ease, transform 0.15s ease; }
    .log-line.visible { opacity: 1; transform: translateY(0); }
    .criteria-item { transition: background 0.2s ease; }
    ::-webkit-scrollbar { width: 6px; } 
    ::-webkit-scrollbar-track { background: #1e1e2e; }
    ::-webkit-scrollbar-thumb { background: #3730a3; border-radius: 3px; }
    .status-pill { display: inline-flex; align-items: center; gap: 4px; }
    .pulse-dot { width: 8px; height: 8px; border-radius: 50%; }
    .pulse-dot.running { background: #f59e0b; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.5; transform:scale(0.85); } }
    .spec-row { cursor: pointer; transition: background 0.15s; }
    .spec-row:hover { background: rgba(99,102,241,0.08); }
    .spec-row.active { background: rgba(99,102,241,0.15); border-left: 3px solid #6366f1; }
    .coverage-bar-fill { transition: width 1s cubic-bezier(0.4,0,0.2,1); }
    .tab { cursor: pointer; padding: 8px 16px; border-bottom: 2px solid transparent; transition: all 0.15s; color: #94a3b8; }
    .tab.active { border-color: #6366f1; color: #e2e8f0; }
    .tab:hover:not(.active) { color: #cbd5e1; }
  </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-slate-800 px-6 py-4 flex items-center justify-between flex-shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded bg-indigo-600 flex items-center justify-center text-white font-bold text-sm">A</div>
      <div>
        <div class="font-semibold text-slate-100 text-sm">Agent on Demand</div>
        <div class="text-xs text-slate-500">Spec-Driven Development Demo &mdash; <span class="text-indigo-400">acai.sh</span> integration</div>
      </div>
    </div>
    <div class="flex items-center gap-6 text-xs text-slate-400">
      <div class="flex items-center gap-2">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-400"></span>
        <span>4 specs</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="inline-block w-2 h-2 rounded-full bg-amber-400"></span>
        <span>1 agent running</span>
      </div>
      <div class="text-slate-500">Coverage: <span id="global-coverage" class="text-slate-200 font-medium">69%</span></div>
    </div>
  </header>

  <!-- Pipeline flow -->
  <div class="border-b border-slate-800 px-6 py-3 flex items-center gap-1 text-xs overflow-x-auto flex-shrink-0">
    <span class="text-slate-500 mr-2 flex-shrink-0">Lifecycle:</span>
    <div class="flex items-center gap-1 flex-shrink-0">
      <span class="px-2 py-0.5 rounded bg-slate-800 text-slate-400">Draft</span>
      <span class="text-slate-600">&rarr;</span>
      <span class="px-2 py-0.5 rounded bg-slate-700 text-slate-300">Assigned</span>
      <span class="text-slate-600">&rarr;</span>
      <span class="px-2 py-0.5 rounded bg-amber-900/60 text-amber-300">Agent Running</span>
      <span class="text-slate-600">&rarr;</span>
      <span class="px-2 py-0.5 rounded bg-blue-900/60 text-blue-300">Implemented</span>
      <span class="text-slate-600">&rarr;</span>
      <span class="px-2 py-0.5 rounded bg-violet-900/60 text-violet-300">In Review</span>
      <span class="text-slate-600">&rarr;</span>
      <span class="px-2 py-0.5 rounded bg-emerald-900/60 text-emerald-300">Accepted</span>
    </div>
  </div>

  <!-- Main content -->
  <div class="flex flex-1 min-h-0">

    <!-- Spec sidebar -->
    <aside class="w-72 border-r border-slate-800 flex flex-col flex-shrink-0 overflow-y-auto">
      <div class="px-4 py-3 border-b border-slate-800 flex items-center justify-between">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Specs</span>
        <button onclick="showNewSpecToast()" class="text-xs text-indigo-400 hover:text-indigo-300 transition-colors">+ New</button>
      </div>
      <div id="spec-list" class="flex-1"></div>
    </aside>

    <!-- Detail pane -->
    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">

      <!-- Spec header -->
      <div id="spec-header" class="px-6 py-4 border-b border-slate-800 flex-shrink-0">
        <div class="flex items-start justify-between gap-4">
          <div>
            <div class="flex items-center gap-3 mb-1">
              <span id="detail-id" class="mono text-xs text-indigo-400 font-medium"></span>
              <span id="detail-status-pill"></span>
            </div>
            <h1 id="detail-title" class="text-lg font-semibold text-slate-100"></h1>
            <p id="detail-desc" class="text-sm text-slate-400 mt-1"></p>
          </div>
          <div class="flex items-center gap-2 flex-shrink-0">
            <button id="trigger-btn" onclick="triggerAgent()" class="px-3 py-1.5 text-xs font-medium rounded bg-indigo-600 hover:bg-indigo-500 text-white transition-colors disabled:opacity-40 disabled:cursor-not-allowed">Trigger Agent</button>
          </div>
        </div>
        <!-- coverage bar -->
        <div class="mt-3">
          <div class="flex items-center justify-between text-xs text-slate-500 mb-1">
            <span>Coverage</span>
            <span id="coverage-label"></span>
          </div>
          <div class="h-1.5 bg-slate-800 rounded-full overflow-hidden">
            <div id="coverage-bar" class="h-full bg-indigo-500 coverage-bar-fill rounded-full" style="width:0%"></div>
          </div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="flex border-b border-slate-800 px-6 flex-shrink-0">
        <div class="tab active" id="tab-criteria" onclick="switchTab('criteria')">Acceptance Criteria</div>
        <div class="tab" id="tab-log" onclick="switchTab('log')">Agent Log</div>
        <div class="tab" id="tab-refs" onclick="switchTab('refs')">Code References</div>
      </div>

      <!-- Tab content -->
      <div class="flex-1 overflow-y-auto">
        <div id="pane-criteria" class="p-6"></div>
        <div id="pane-log" class="hidden p-6 mono text-xs"></div>
        <div id="pane-refs" class="hidden p-6"></div>
      </div>
    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 border border-slate-700 text-slate-200 text-sm px-4 py-3 rounded-lg shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none max-w-xs">
    <span id="toast-msg"></span>
  </div>

<script>
const SPECS = [
  {
    id: 'BILLING-001',
    title: 'Stripe checkout flow',
    description: 'Users can purchase a subscription via Stripe Checkout. Session is created server-side; webhook confirms payment.',
    status: 'accepted',
    criteria: [
      { text: 'POST /billing/checkout creates a Stripe Checkout Session and returns the URL', status: 'accepted', ref: 'lib/billing/checkout.ex:31' },
      { text: 'Webhook POST /billing/webhook verifies signature and activates subscription on payment_intent.succeeded', status: 'accepted', ref: 'lib/billing/webhook_handler.ex:18' },
      { text: 'GET /billing/success renders confirmation page with plan details', status: 'accepted', ref: 'lib/web/controllers/billing_controller.ex:55' },
    ],
    log: [
      { type: 'stage', text: '▶ provision started' },
      { type: 'stage', text: '▶ setup done (4.2s)' },
      { type: 'stage', text: '▶ turn 1 started' },
      { type: 'output', text: 'Reading BILLING-001 spec...' },
      { type: 'output', text: 'Creating lib/billing/checkout.ex' },
      { type: 'output', text: '# BILLING-001: Stripe session creation' },
      { type: 'output', text: 'Creating lib/billing/webhook_handler.ex' },
      { type: 'output', text: '# BILLING-001: webhook signature verification' },
      { type: 'output', text: 'Adding route: POST /billing/webhook' },
      { type: 'output', text: 'Running mix test test/billing/ ... 3 passed' },
      { type: 'stage', text: '▶ turn 1 done (exit 0)' },
      { type: 'output', text: '' },
      { type: 'output', text: 'Summary — BILLING-001:' },
      { type: 'output', text: '  ✓ criterion 1 → lib/billing/checkout.ex:31' },
      { type: 'output', text: '  ✓ criterion 2 → lib/billing/webhook_handler.ex:18' },
      { type: 'output', text: '  ✓ criterion 3 → lib/web/controllers/billing_controller.ex:55' },
    ]
  },
  {
    id: 'AUTH-001',
    title: 'Magic link login',
    description: 'Users log in via a one-time email link. No password required. Token expires after 15 minutes.',
    status: 'in-review',
    criteria: [
      { text: 'POST /auth/magic_link generates a 6-digit token stored in Redis with 15-minute TTL', status: 'implemented', ref: 'lib/auth/magic_link.ex:24' },
      { text: 'Email is dispatched via the configured mailer with the login link', status: 'implemented', ref: 'lib/mailer/magic_link_email.ex:11' },
      { text: 'GET /auth/confirm?token=... exchanges the token for a session cookie', status: 'implemented', ref: 'lib/auth/magic_link_controller.ex:12' },
      { text: 'Token is deleted from Redis immediately after first use', status: 'implemented', ref: 'lib/auth/magic_link.ex:41' },
      { text: 'Expired or unknown tokens return 401 with a user-readable JSON error', status: 'missing', ref: null },
    ],
    log: [
      { type: 'stage', text: '▶ provision started' },
      { type: 'stage', text: '▶ setup done (3.8s)' },
      { type: 'stage', text: '▶ turn 1 started' },
      { type: 'output', text: 'Reading AUTH-001 spec...' },
      { type: 'output', text: 'Creating lib/auth/magic_link.ex' },
      { type: 'output', text: '# AUTH-001: token generation + Redis storage' },
      { type: 'output', text: 'Creating lib/mailer/magic_link_email.ex' },
      { type: 'output', text: '# AUTH-001: email dispatch' },
      { type: 'output', text: 'Creating lib/auth/magic_link_controller.ex' },
      { type: 'output', text: '# AUTH-001: token exchange → session cookie' },
      { type: 'output', text: 'Running mix test test/auth/magic_link_test.exs ... 4 passed, 1 failed' },
      { type: 'output', text: '  1) expired token returns 401 — got 500' },
      { type: 'stage', text: '▶ turn 1 done (exit 1)' },
      { type: 'output', text: '' },
      { type: 'output', text: 'Summary — AUTH-001:' },
      { type: 'output', text: '  ✓ criterion 1 → lib/auth/magic_link.ex:24' },
      { type: 'output', text: '  ✓ criterion 2 → lib/mailer/magic_link_email.ex:11' },
      { type: 'output', text: '  ✓ criterion 3 → lib/auth/magic_link_controller.ex:12' },
      { type: 'output', text: '  ✓ criterion 4 → lib/auth/magic_link.ex:41' },
      { type: 'output', text: '  ✗ criterion 5 → NOT FOUND (expired token error handling missing)' },
    ]
  },
  {
    id: 'API-001',
    title: 'Rate limiting middleware',
    description: 'All /api/* routes are rate-limited per IP. Clients that exceed the limit receive 429 with Retry-After.',
    status: 'running',
    criteria: [
      { text: 'Requests to /api/* are counted per IP using ETS with a 60-second sliding window', status: 'implemented', ref: 'lib/plug/rate_limiter.ex:8' },
      { text: '429 Too Many Requests is returned with Retry-After header when limit exceeded', status: 'implemented', ref: 'lib/plug/rate_limiter.ex:44' },
      { text: 'Limit is configurable via application env (default: 600 req/min)', status: 'missing', ref: null },
      { text: 'Authenticated requests use user ID as key instead of IP', status: 'missing', ref: null },
    ],
    log: [
      { type: 'stage', text: '▶ provision started' },
      { type: 'stage', text: '▶ setup done (4.1s)' },
      { type: 'stage', text: '▶ turn 1 started' },
      { type: 'output', text: 'Reading API-001 spec...' },
      { type: 'output', text: 'Creating lib/plug/rate_limiter.ex' },
      { type: 'output', text: '# API-001: ETS sliding window counter' },
      { type: 'output', text: '# API-001: 429 response + Retry-After header' },
      { type: 'output', text: 'Running mix test test/plug/rate_limiter_test.exs ...' },
    ]
  },
  {
    id: 'AUTH-002',
    title: 'OAuth2 — Google login',
    description: 'Users can sign in with their Google account. On first login, an account is created automatically.',
    status: 'draft',
    criteria: [
      { text: 'GET /auth/google redirects to Google OAuth2 consent screen with correct scopes', status: 'missing', ref: null },
      { text: 'GET /auth/google/callback exchanges code for tokens, upserts user, and sets session', status: 'missing', ref: null },
      { text: 'If Google email is already associated with a password account, accounts are merged', status: 'missing', ref: null },
    ],
    log: []
  },
];

let activeId = SPECS[1].id;
let activeTab = 'criteria';
let isAnimating = false;

const STATUS_META = {
  accepted:     { label: 'Accepted',       bg: 'bg-emerald-900/60', text: 'text-emerald-300', dot: 'bg-emerald-400' },
  'in-review':  { label: 'In Review',      bg: 'bg-violet-900/60',  text: 'text-violet-300',  dot: 'bg-violet-400' },
  running:      { label: 'Agent Running',  bg: 'bg-amber-900/60',   text: 'text-amber-300',   dot: 'bg-amber-400', pulse: true },
  draft:        { label: 'Draft',          bg: 'bg-slate-800',      text: 'text-slate-400',   dot: 'bg-slate-500' },
};

const CRITERIA_META = {
  accepted:    { icon: '✓', color: 'text-emerald-400', bg: 'bg-emerald-900/20 border-emerald-800/40' },
  implemented: { icon: '✓', color: 'text-blue-400',    bg: 'bg-blue-900/20 border-blue-800/40' },
  missing:     { icon: '✗', color: 'text-red-400',     bg: 'bg-red-900/10 border-red-800/30' },
};

function renderSidebar() {
  const list = document.getElementById('spec-list');
  list.innerHTML = SPECS.map(s => {
    const m = STATUS_META[s.status];
    const done = s.criteria.filter(c => c.status !== 'missing').length;
    const total = s.criteria.length;
    const pct = Math.round(done / total * 100);
    return `
    <div class="spec-row px-4 py-3 border-b border-slate-800/60 ${s.id === activeId ? 'active' : ''}" onclick="selectSpec('${s.id}')">
      <div class="flex items-center justify-between mb-1">
        <span class="mono text-xs text-indigo-400 font-medium">${s.id}</span>
        <span class="status-pill ${m.bg} ${m.text} text-xs px-1.5 py-0.5 rounded">
          ${m.pulse ? `<span class="pulse-dot running"></span>` : `<span class="inline-block w-1.5 h-1.5 rounded-full ${m.dot}"></span>`}
          ${m.label}
        </span>
      </div>
      <div class="text-sm text-slate-300 truncate">${s.title}</div>
      <div class="mt-2 h-1 bg-slate-800 rounded-full overflow-hidden">
        <div class="h-full rounded-full ${ pct===100 ? 'bg-emerald-500' : 'bg-indigo-500'} transition-all" style="width:${pct}%"></div>
      </div>
      <div class="text-xs text-slate-600 mt-0.5">${done}/${total} criteria</div>
    </div>`;
  }).join('');
}

function renderDetail() {
  const spec = SPECS.find(s => s.id === activeId);
  if (!spec) return;
  const m = STATUS_META[spec.status];
  const done = spec.criteria.filter(c => c.status !== 'missing').length;
  const total = spec.criteria.length;
  const pct = Math.round(done / total * 100);

  document.getElementById('detail-id').textContent = spec.id;
  document.getElementById('detail-title').textContent = spec.title;
  document.getElementById('detail-desc').textContent = spec.description;
  document.getElementById('coverage-label').textContent = `${done}/${total} criteria`;
  document.getElementById('detail-status-pill').innerHTML =
    `<span class="status-pill ${m.bg} ${m.text} text-xs px-2 py-0.5 rounded">
      ${m.pulse ? `<span class="pulse-dot running"></span>` : `<span class="inline-block w-1.5 h-1.5 rounded-full ${m.dot}"></span>`}
      ${m.label}
    </span>`;

  setTimeout(() => {
    document.getElementById('coverage-bar').style.width = pct + '%';
    document.getElementById('coverage-bar').className =
      `h-full rounded-full coverage-bar-fill ${ pct===100 ? 'bg-emerald-500' : 'bg-indigo-500'}`;
  }, 80);

  const triggerBtn = document.getElementById('trigger-btn');
  if (spec.status === 'running' || spec.status === 'accepted') {
    triggerBtn.disabled = true;
    triggerBtn.textContent = spec.status === 'running' ? 'Running…' : 'Accepted';
  } else {
    triggerBtn.disabled = false;
    triggerBtn.textContent = 'Trigger Agent';
  }

  renderCriteria(spec);
  renderLog(spec);
  renderRefs(spec);
}

function renderCriteria(spec) {
  const pane = document.getElementById('pane-criteria');
  pane.innerHTML = spec.criteria.map((c, i) => {
    const m = CRITERIA_META[c.status];
    return `
    <div class="criteria-item flex items-start gap-3 p-3 rounded-lg border ${m.bg} mb-2">
      <span class="${m.color} font-bold mt-0.5 flex-shrink-0 mono text-sm">${m.icon}</span>
      <div class="flex-1 min-w-0">
        <div class="text-sm text-slate-200">${c.text}</div>
        ${c.ref ? `<div class="mono text-xs text-slate-500 mt-1">${c.ref}</div>` : ''}
      </div>
      <span class="text-xs text-slate-600 flex-shrink-0">#${i+1}</span>
    </div>`;
  }).join('');
}

function renderLog(spec) {
  const pane = document.getElementById('pane-log');
  if (spec.log.length === 0) {
    pane.innerHTML = '<div class="text-slate-600 italic">No agent runs yet.</div>';
    return;
  }
  pane.innerHTML = spec.log.map(l => {
    const color = l.type === 'stage' ? 'text-indigo-400' : 'text-slate-300';
    return `<div class="log-line visible ${color} leading-relaxed">${escHtml(l.text)}</div>`;
  }).join('');
}

function renderRefs(spec) {
  const pane = document.getElementById('pane-refs');
  const refs = spec.criteria.filter(c => c.ref);
  if (refs.length === 0) {
    pane.innerHTML = '<div class="text-slate-600 italic text-sm">No code references yet — trigger an agent to implement this spec.</div>';
    return;
  }
  pane.innerHTML = `
    <div class="text-xs text-slate-500 mb-4">These file locations were tagged with <span class="mono text-indigo-400">${spec.id}</span> by the agent.</div>
    <div class="space-y-2">
    ${ refs.map((c,i) => `
      <div class="flex items-center gap-3 p-3 rounded-lg bg-slate-900 border border-slate-800">
        <span class="mono text-xs text-emerald-400 font-medium flex-shrink-0">${c.ref}</span>
        <span class="text-slate-500 text-xs truncate">${c.text.slice(0,60)}${c.text.length>60?'…':''}</span>
      </div>`).join('')}
    </div>
    <div class="mt-4 p-3 rounded-lg bg-slate-900 border border-slate-800">
      <div class="text-xs text-slate-500 mb-2">Grep for these in your repo:</div>
      <code class="mono text-xs text-indigo-300">grep -r "${spec.id}" lib/ --include="*.ex" -n</code>
    </div>`;
}

function selectSpec(id) {
  activeId = id;
  activeTab = 'criteria';
  renderSidebar();
  renderDetail();
  switchTab('criteria');
}

function switchTab(name) {
  activeTab = name;
  ['criteria','log','refs'].forEach(t => {
    document.getElementById('tab-'+t).className = 'tab' + (t===name ? ' active' : '');
    document.getElementById('pane-'+t).className = (t===name ? 'p-6' : 'hidden p-6') + (t==='log' ? ' mono text-xs' : '');
  });
}

function triggerAgent() {
  const spec = SPECS.find(s => s.id === activeId);
  if (!spec || isAnimating) return;
  isAnimating = true;

  const btn = document.getElementById('trigger-btn');
  btn.disabled = true;
  btn.textContent = 'Queuing…';

  spec.status = 'running';
  renderSidebar();
  renderDetail();

  switchTab('log');

  const pane = document.getElementById('pane-log');
  const lines = [
    { type: 'stage', text: '▶ provision started' },
    { type: 'output', text: `Cloning repo... done` },
    { type: 'output', text: `Installing packages... done` },
    { type: 'stage', text: '▶ provision done (5.1s)' },
    { type: 'stage', text: `▶ turn 1 started` },
    { type: 'output', text: `Reading ${spec.id} from specs/${spec.id.toLowerCase().replace('-','/')}.yaml...` },
    { type: 'output', text: `${spec.criteria.length} acceptance criteria loaded.` },
    ...spec.criteria.map((c, i) => ({ type: 'output', text: `Implementing criterion ${i+1}: ${c.text.slice(0,50)}...` })),
    { type: 'output', text: 'Running mix test ...' },
    { type: 'stage', text: '▶ turn 1 done (exit 0)' },
    { type: 'output', text: '' },
    { type: 'output', text: `Summary — ${spec.id}:` },
    ...spec.criteria.map((c, i) => ({ type: 'output', text: `  ✓ criterion ${i+1} — tagged with ${spec.id}` })),
    { type: 'output', text: '' },
    { type: 'output', text: 'Opening PR...' },
    { type: 'stage', text: `▶ Done. PR created: feat/${spec.id.toLowerCase()}-impl` },
  ];

  spec.log = lines;
  pane.innerHTML = '';

  let i = 0;
  function addLine() {
    if (i >= lines.length) {
      // Mark all criteria as implemented
      spec.criteria.forEach(c => {
        if (c.status === 'missing') {
          c.status = 'implemented';
          c.ref = `lib/${spec.id.split('-')[0].toLowerCase()}/${spec.id.toLowerCase().replace('-','_')}.ex:${Math.floor(Math.random()*80)+10}`;
        }
      });
      spec.status = 'in-review';
      isAnimating = false;
      renderSidebar();
      renderDetail();
      showToast(`Agent finished ${spec.id}. PR opened — ready for review.`);
      return;
    }
    const l = lines[i++];
    const div = document.createElement('div');
    div.className = 'log-line ' + (l.type==='stage' ? 'text-indigo-400' : 'text-slate-300') + ' leading-relaxed';
    div.textContent = l.text;
    pane.appendChild(div);
    requestAnimationFrame(() => div.classList.add('visible'));
    pane.scrollTop = pane.scrollHeight;
    setTimeout(addLine, l.type==='stage' ? 180 : 60);
  }
  setTimeout(addLine, 400);
}

function showNewSpecToast() {
  showToast('In the real integration, this creates a new feature.yaml and commits it — triggering an agent automatically via CI.');
}

function showToast(msg) {
  const el = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0', 4000);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Init
renderSidebar();
renderDetail();
</script>
</body>
</html>
