[project]
name = "aod-client"
version = "0.1.0"
description = "Python client for the Agent on Demand API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aod_client"]
