name: Release bump

# Manually-triggered workflow that bumps the patch version in all three
# mix.exs files (umbrella + both child apps), commits, tags, and pushes.
# The tag push triggers `release.yml`, which builds + uploads the
# Burrito binaries to the GitHub Release.
#
# Run from the Actions tab → "Release bump" → "Run workflow".
# Defaults to `patch`; minor / major are available as inputs.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which segment to bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump:
    name: Bump version, commit, tag, push
    runs-on: ubuntu-latest

    permissions:
      # Push commit + tag back to main.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so `git tag` sees existing tags and so
          # the push back to main isn't a shallow-clone reject.
          fetch-depth: 0
          # Default GITHUB_TOKEN is fine — `permissions: contents: write`
          # above grants the push.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          current=$(grep -oE 'version: "[0-9]+\.[0-9]+\.[0-9]+"' mix.exs \
            | head -1 \
            | sed -E 's/version: "([0-9]+\.[0-9]+\.[0-9]+)"/\1/')
          echo "current=$current"
          IFS='.' read -r major minor patch <<<"$current"
          case "${{ inputs.bump }}" in
            patch) patch=$((patch + 1)) ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
            *) echo "unknown bump: ${{ inputs.bump }}" >&2; exit 1 ;;
          esac
          next="${major}.${minor}.${patch}"
          tag="v${next}"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"   >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} already exists" >&2
            exit 1
          fi

      - name: Update mix.exs files
        run: |
          set -euo pipefail
          current='${{ steps.ver.outputs.current }}'
          next='${{ steps.ver.outputs.next }}'
          # Only touch the umbrella + the two child apps. Hard-coded
          # rather than `find` to avoid clobbering version: in deps.
          sed -i -E "s/version: \"${current}\"/version: \"${next}\"/" mix.exs
          sed -i -E "s/version: \"${current}\"/version: \"${next}\"/" apps/agent_on_demand/mix.exs
          sed -i -E "s/version: \"${current}\"/version: \"${next}\"/" apps/aod_cli/mix.exs
          git diff --stat

      - name: Commit, tag, push
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mix.exs apps/agent_on_demand/mix.exs apps/aod_cli/mix.exs
          # `[skip ci]` keeps the bump commit from triggering the regular
          # CI workflow on its own — the tag push triggers release.yml,
          # which is the only run that matters for a release.
          git commit -m "chore(release): ${TAG} [skip ci]"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin HEAD:main
          git push origin "${TAG}"
