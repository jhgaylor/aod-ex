name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MIX_ENV: test
  # Match the target ERTS in mix.exs so dev/CI/release all run the
  # same OTP. Avoids cross-version NIF mismatches.
  ELIXIR_VERSION: "1.19.5"
  OTP_VERSION: "28.4"

jobs:
  precommit:
    name: mix precommit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang + Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      # The sprites-ex dep is a sibling path. CI checks out only
      # this repo, so we shim the path to ../sprites-ex with the
      # upstream repo at HEAD. We can't use actions/checkout for
      # this — it refuses paths outside $GITHUB_WORKSPACE. Raw
      # `git clone` works fine. Pin via a submodule or a CI secret
      # if we want reproducibility.
      - name: Clone sprites-ex (sibling path dep)
        run: git clone --depth 1 https://github.com/superfly/sprites-ex.git ../sprites-ex

      - name: Cache deps + _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install deps
        run: mix deps.get --only test

      - name: mix precommit
        run: mix precommit
