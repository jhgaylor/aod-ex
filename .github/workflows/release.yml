name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release as (e.g. v0.1.0)"
        required: true

env:
  MIX_ENV: prod
  # Match the target ERTS in mix.exs (custom_erts URLs pin OTP 28.4).
  # Different local vs. target versions land BEAMs and NIFs from
  # different OTPs into the same release and the runtime crashes
  # at first stdio with `Function not found prim_tty:tty_create/1`.
  ELIXIR_VERSION: "1.19.5"
  OTP_VERSION: "28.4"
  ZIG_VERSION: "0.15.2"

jobs:
  build:
    name: Build cross-platform binaries
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Erlang + Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      # Burrito cross-builds via Zig. The Burrito custom_erts URLs
      # (mix.exs) point at OTP 28.4 musl/macos universal tarballs;
      # Zig 0.15.2 is the version those workarounds were written
      # against (see docs/deploy.md).
      - name: Set up Zig ${{ env.ZIG_VERSION }}
        run: |
          curl -L "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            | tar -xJ
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
          "$PWD/zig-x86_64-linux-${ZIG_VERSION}/zig" version

      # sprites-ex is a sibling path dep — same shim as ci.yml.
      # Raw git clone because actions/checkout refuses paths outside
      # $GITHUB_WORKSPACE. Clone the ravi-hq fork's `fix/filesystem-urls`
      # branch — it has two URL fixes (filesystem + attach_session)
      # not yet merged into superfly/sprites-ex's main, and they're
      # load-bearing for `aod up`.
      - name: Clone sprites-ex (sibling path dep)
        run: git clone --depth 1 --branch fix/filesystem-urls https://github.com/ravi-hq/sprites-ex.git ../sprites-ex

      - name: Cache deps + _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-release-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install deps
        run: mix deps.get --only prod

      - name: Build releases (CLI + server, linux + macos for each)
        run: |
          mix release aod --overwrite
          mix release aod_server --overwrite

      - name: Inspect output
        run: ls -la burrito_out/

      - name: Stage assets
        id: stage
        run: |
          mkdir -p release-assets
          # Burrito names the binaries `<release_name>_<target>`. We
          # rename to include the OS+arch in the filename so the
          # release page is unambiguous.
          cp burrito_out/aod_linux         "release-assets/aod-linux-x86_64"
          cp burrito_out/aod_macos         "release-assets/aod-macos-aarch64"
          cp burrito_out/aod_server_linux  "release-assets/aod-server-linux-x86_64"
          cp burrito_out/aod_server_macos  "release-assets/aod-server-macos-aarch64"
          chmod +x release-assets/*
          ls -la release-assets/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            release-assets/aod-linux-x86_64
            release-assets/aod-macos-aarch64
            release-assets/aod-server-linux-x86_64
            release-assets/aod-server-macos-aarch64
