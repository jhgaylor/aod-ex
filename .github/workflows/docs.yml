name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'priv/help/**'
      - 'docs/**'
      - 'clients/*/README.md'
      - '.claude/skills/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Allow only one concurrent deploy, queue subsequent triggers.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install MkDocs
        run: pip install mkdocs mkdocs-material

      - name: Sync content
        working-directory: site
        run: ./sync_content.sh

      - name: Build site
        working-directory: site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
